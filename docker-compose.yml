services:
  db:
    image: postgres:16
    container_name: sinalize_mobile_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sinalize
      POSTGRES_USER: ${DB_USER:-sinalize}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sinalize}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - sinalize_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sinalize_data:
